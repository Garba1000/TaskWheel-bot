<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tap & Earn</title>

<style>
body { font-family: Arial; background:#000; color:#fff; margin:0; padding:20px;}
.section{margin-top:20px; padding:15px; background:#111; border-radius:10px;}
.btn{display:inline-block;margin-top:10px;padding:10px 15px;border-radius:8px;background:#007bff;color:#fff;font-weight:bold;cursor:pointer;text-align:center;}
#taskProgress{margin-top:10px;height:20px;width:100%;background:#333;border-radius:10px;overflow:hidden;}
#taskProgressBar{height:100%;width:0%;background:#007bff;text-align:center;line-height:20px;font-weight:bold;color:#fff;}
</style>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>

<body>

<div id="mainPage">
<h1>⚡ Real Tap & Earn</h1>

<p>
Points: <span id="points">0</span> | 
Today Tap: <span id="dailyTap">0</span>/500
</p>

<div class="btn" id="tapBtn">⚡ Tap to Earn 1 Point</div>

<div class="btn" onclick="watchBonusAd()">🎁 Watch Ad for +20 Points</div>

<div class="section">
<h2>📋 Tasks</h2>
<div class="btn" id="startTasksBtn">📋 Task & Earn 50 Points</div>
<div id="adsgram-container"></div>
<div id="taskProgress">
  <div id="taskProgressBar">0/10</div>
</div>
</div>

<div class="section">
<h2>💳 Withdraw</h2>
<p><b>Minimum withdrawal: 15,000 points</b></p>

<select id="method">
<option>Litecoin</option>
<option>USDT</option>
<option>Payeer</option>
<option>Bank</option>
</select>

<input id="address" placeholder="Enter wallet/account"/>
<input id="amount" type="number" placeholder="Enter amount"/>

<div class="btn" id="withdrawBtn">Request Withdraw</div>
</div>

<div class="section">
<h2>👥 Referral</h2>
<input id="refLink" readonly/>
<div class="btn" id="copyRefBtn">Copy</div>
</div>

</div>

<script>
const webApp = Telegram.WebApp;

/* INIT */
if(!localStorage.getItem("init")){
localStorage.setItem("points","0");
localStorage.setItem("dailyTap","0");
localStorage.setItem("lastDate", new Date().toDateString());
localStorage.setItem("init","yes");
}

let points = parseInt(localStorage.getItem("points")||0);
let dailyTap = parseInt(localStorage.getItem("dailyTap")||0);
let lastDate = localStorage.getItem("lastDate");

/* RESET DAILY */
const today = new Date().toDateString();
if(today !== lastDate){
dailyTap = 0;
localStorage.setItem("dailyTap",0);
localStorage.setItem("lastDate", today);
}

/* UI */
function updateUI(){
document.getElementById("points").innerText = points;
document.getElementById("dailyTap").innerText = dailyTap;
}
updateUI();

/* TAP */
document.getElementById("tapBtn").onclick = ()=>{
if(dailyTap >= 500){
alert("🚫 Daily tap limit reached (500)");
return;
}

points += 1;
dailyTap += 1;

localStorage.setItem("points",points);
localStorage.setItem("dailyTap",dailyTap);

updateUI();
};

/* BONUS AD */
function watchBonusAd(){
const ad = Adsgram.init({blockId:"27415"});
ad.show().then(res=>{
if(res.done){
points += 20;
localStorage.setItem("points",points);
updateUI();
alert("🎉 +20 points added!");
}
});
}

/* TASKS */
const taskIds = ["task-27416","task-27417","task-27418"];
let taskCount = 0;

document.getElementById("startTasksBtn").onclick = ()=>{
if(!confirm("Watch ad to earn 50 points?")) return;

const block = taskIds[Math.floor(Math.random()*taskIds.length)];

const container = document.getElementById("adsgram-container");
container.innerHTML = `<adsgram-task data-block-id="${block}"></adsgram-task>`;

const task = container.querySelector("adsgram-task");

task.addEventListener("reward",()=>{
points += 50;
taskCount++;

localStorage.setItem("points",points);

document.getElementById("taskProgressBar").style.width = (taskCount*10)+"%";
document.getElementById("taskProgressBar").innerText = taskCount+"/10";

updateUI();
});
};

/* WITHDRAW (FINAL FIXED) */
document.getElementById("withdrawBtn").onclick = ()=>{

let amount = parseInt(document.getElementById("amount").value);

/* MUST HAVE 15K TOTAL */
if(points < 15000){
alert("❌ You need at least 15,000 points to withdraw");
return;
}

if(isNaN(amount) || amount <= 0){
alert("Enter valid amount");
return;
}

if(amount < 15000){
alert("Minimum withdrawal is 15,000 points");
return;
}

if(points < amount){
alert("Not enough points");
return;
}

/* SEND */
points -= amount;
localStorage.setItem("points",points);
updateUI();

Telegram.WebApp.sendData(JSON.stringify({
type:"withdraw",
amount:amount
}));

alert("✅ Withdrawal request sent!");
};

/* REF */
const user = webApp.initDataUnsafe.user || {};
document.getElementById("refLink").value = 
"https://t.me/Builderrebot?start=" + (user.id || "guest");

document.getElementById("copyRefBtn").onclick = ()=>{
navigator.clipboard.writeText(document.getElementById("refLink").value);
};
</script>

</body>
</html>
