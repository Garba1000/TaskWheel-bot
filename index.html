<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tap & Earn X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
  radial-gradient(circle at top,#19b84d,#063517 70%);
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:26px;
  font-weight:bold;
}

.level{
  background:#0e5226;
  padding:10px 16px;
  border-radius:20px;
}

/* WALLETS */
.wallet-bar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.wallet-card{
  flex:1;
  background:#0f4422;
  padding:16px;
  border-radius:18px;
  text-align:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

.card{
  background:#0d3c1d;
  padding:18px;
  border-radius:20px;
}

.section{
  background:#0d3c1d;
  padding:18px;
  border-radius:22px;
  margin-bottom:18px;
}

/* BUTTON */
.btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:16px;
  margin-top:14px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#25ff74,#00c853);
  color:#000;
  font-size:15px;
}

.btn:active{
  transform:scale(0.98);
}

/* INPUT */
input,select{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:#184d2a;
  color:white;
  margin-top:12px;
}

/* =========================
   NEW SPIN SPINNER DESIGN
   ========================= */

#wheel{
  width:280px;
  height:280px;
  margin:25px auto;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 3 ARM SPINNER BASE */
.spinner{
  width:100%;
  height:100%;
  position:relative;
  animation:floatGlow 2.5s infinite ease-in-out;
}

/* ARMS */
.arm{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#4de3ff,#0077ff);
  box-shadow:0 0 25px rgba(0,200,255,0.8);
}

/* 3 POSITIONS */
.arm:nth-child(1){
  top:0;
  left:50%;
  transform:translateX(-50%);
}

.arm:nth-child(2){
  bottom:0;
  left:0;
}

.arm:nth-child(3){
  bottom:0;
  right:0;
}

/* CENTER HUB */
.wheel-center{
  width:90px;
  height:90px;
  background:#0a0a0a;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  border:4px solid #00d4ff;
  box-shadow:0 0 20px rgba(0,200,255,0.7);
}

/* soft animation */
@keyframes floatGlow{
  0%,100%{transform:rotate(0deg) scale(1);}
  50%{transform:rotate(5deg) scale(1.02);}
}

/* POINTER */
.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:30px solid white;
  margin:auto;
  margin-top:-10px;
}

/* DAILY BAR */
#dailyProgressBar{
  width:100%;
  height:8px;
  background:#184d2a;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

#dailyProgressBar div{
  width:0%;
  height:100%;
  background:#25ff74;
}

/* JOIN POPUP */
#joinPopup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  text-align:center;
}

#joinBtn{
  width:220px;
  border:none;
  padding:14px;
  border-radius:16px;
  margin-top:14px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#25ff74,#00c853);
  color:#000;
  font-size:15px;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">⚡ Tap & Earn X</div>
  <div class="level">Level <span id="level">1</span></div>
</div>

<div class="wallet-bar">
  <div class="wallet-card"><h3>⚡ Energy</h3><p id="energy">0</p></div>
  <div class="wallet-card"><h3>💰 PV</h3><p id="points">0</p></div>
  <div class="wallet-card"><h3>👥 Referrals</h3><p id="refs">0</p></div>
</div>

<div class="grid">
  <div class="card"><h3>🎡 Total Played</h3><p id="taps">0</p></div>
  <div class="card"><h3>🏆 Referral PV</h3><p id="refEarn">0</p></div>
</div>

<div class="section">

<h2>🎡 Spin & Earn</h2>

<div id="wheel">
  <div class="spinner">

    <div class="arm"></div>
    <div class="arm"></div>
    <div class="arm"></div>

    <div class="wheel-center">SPIN</div>

  </div>
</div>

<div class="pointer"></div>

<button class="btn" id="spinBtn">
  Spin (-10 Energy)
</button>

</div>

<!-- REST OF YOUR ORIGINAL CODE UNCHANGED -->

<div class="section">
  <h2>📺 Reward Ad</h2>
  <button class="btn" id="rewardBtn">Watch Ad +10 Energy</button>
</div>

<div class="section">
  <h2>🎯 Task Center</h2>
  <button class="btn" id="taskBtn">Complete Task +10 Energy</button>
</div>

<div class="section">
  <h2>🎁 Daily Reward</h2>
  <button class="btn" id="dailyBtn">Claim +3 Energy</button>
  <div id="dailyProgressBar"><div></div></div>
</div>

<div class="section">
  <h2>👥 Referral</h2>
  <input id="refInput" readonly>
  <button class="btn" id="copyBtn">Copy Referral Link</button>
</div>

<div class="section">
  <h2>💳 Withdraw</h2>
  <select id="method">
    <option>USDT</option>
    <option>Litecoin</option>
    <option>Payeer</option>
    <option>Bank</option>
  </select>

  <input id="wallet" placeholder="Wallet Address">
  <input id="amount" type="number" placeholder="Amount">

  <button class="btn" id="withdrawBtn">Withdraw PV</button>
</div>

<!-- JOIN POPUP -->
<div id="joinPopup">
  <h2 style="margin-bottom:15px;">Join Our Channel</h2>
  <button id="joinBtn">Join Channel +5 Energy</button>
</div>

<!-- YOUR JS REMAINS EXACTLY THE SAME -->

<script>
// (no logic changes needed — your original JS stays here)
</script>

</body>
</html>
