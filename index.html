<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tap & Earn X</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background: radial-gradient(circle at top,#19b84d,#063517 70%);
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:26px;
  font-weight:bold;
}

.level{
  background:#0e5226;
  padding:10px 16px;
  border-radius:20px;
}

/* WALLETS */
.wallet-bar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.wallet-card{
  flex:1;
  background:#0f4422;
  padding:16px;
  border-radius:18px;
  text-align:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

.card{
  background:#0d3c1d;
  padding:18px;
  border-radius:20px;
}

.section{
  background:#0d3c1d;
  padding:18px;
  border-radius:22px;
  margin-bottom:18px;
}

/* BUTTON */
.btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:16px;
  margin-top:14px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#25ff74,#00c853);
  color:#000;
  font-size:15px;
}

.btn:active{
  transform:scale(0.98);
}

/* INPUT */
input,select{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:#184d2a;
  color:white;
  margin-top:12px;
}

/* =========================
   SPIN WHEEL
   ========================= */

#wheel{
  width:280px;
  height:280px;
  margin:25px auto;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.spinner{
  width:100%;
  height:100%;
  position:relative;
  transform-origin:center;
}

.arm{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:conic-gradient(
    #00ff87,
    #60efff,
    #ff6ec4,
    #ffd86f,
    #00ff87
  );
  box-shadow:0 0 25px rgba(0,200,255,0.8);
}

.arm:nth-child(1){
  top:0;
  left:50%;
  transform:translateX(-50%);
}

.arm:nth-child(2){
  bottom:0;
  left:0;
}

.arm:nth-child(3){
  bottom:0;
  right:0;
}

/* CENTER */
.wheel-center{
  width:90px;
  height:90px;
  background:#0a0a0a;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  border:4px solid #00d4ff;
  box-shadow:0 0 20px rgba(0,200,255,0.7);
}

/* POINTER */
.pointer{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:30px solid white;
  margin:auto;
  margin-top:-10px;
}

/* DAILY BAR */
#dailyProgressBar{
  width:100%;
  height:8px;
  background:#184d2a;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

#dailyProgressBar div{
  width:0%;
  height:100%;
  background:#25ff74;
}

/* JOIN POPUP */
#joinPopup{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  text-align:center;
}

#joinPopup button{
  padding:14px 20px;
  border:none;
  border-radius:12px;
  background:#25ff74;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">⚡ Tap & Earn X</div>
  <div class="level">Level <span id="level">1</span></div>
</div>

<div class="wallet-bar">
  <div class="wallet-card"><h3>⚡ GRAM</h3><p id="GRAM">50</p></div>
  <div class="wallet-card"><h3>💰 PV</h3><p id="points">0</p></div>
  <div class="wallet-card"><h3>👥 Referrals</h3><p id="refs">0</p></div>
</div>

<div class="grid">
  <div class="card"><h3>🎡 Total Played</h3><p id="taps">0</p></div>
  <div class="card"><h3>🏆 Referral PV</h3><p id="refEarn">0</p></div>
</div>

<div class="section">

<h2>🎡 Spin & Earn</h2>

<div id="wheel">
  <div class="spinner">

    <div class="arm"></div>
    <div class="arm"></div>
    <div class="arm"></div>

    <div class="wheel-center">SPIN</div>

  </div>
</div>

<div class="pointer"></div>

<button class="btn" id="spinBtn">Spin (-10 GRAM)</button>

</div>

<div class="section">
  <h2>🎁 Daily Reward</h2>
  <button class="btn" id="dailyBtn">Claim +3500 GRAM</button>
  <p id="dailyTimer" style="font-size:12px; margin-top:10px; color:#aaa;"></p>
  <div id="dailyProgressBar"><div></div></div>
</div>

<div class="section">
  <h2>📺 Reward Ad</h2>
  <button class="btn" id="rewardBtn">Watch Ad +10 GRAM</button>
</div>

<div class="section">
  <h2>🎯 Task Center</h2>
  <button class="btn" id="taskBtn">Complete Task +10 GRAM</button>
</div>

<div class="section">
  <h2>👥 Referral</h2>
  <input id="refInput" readonly>
  <button class="btn" id="copyBtn">Copy Referral Link</button>
</div>

<div class="section">
  <h2>💳 Withdraw</h2>
  <select id="method">
    <option>USDT</option>
    <option>Litecoin</option>
    <option>Payeer</option>
    <option>Bank</option>
  </select>

  <input id="wallet" placeholder="Wallet Address">
  <input id="amount" type="number" placeholder="Amount">

  <button class="btn" id="withdrawBtn">Withdraw PV</button>
</div>

<!-- JOIN POPUP -->
<div id="joinPopup">
  <h2 style="margin-bottom:15px;">Join Our Channel</h2>
  <button id="joinBtn">Join Channel +5 GRAM</button>
</div>

<script>

const tg = window.Telegram?.WebApp;
tg?.expand?.();

const wheel = document.querySelector(".spinner");
const spinBtn = document.getElementById("spinBtn");

let rotation = 0;
let dailyProgress = parseInt(localStorage.getItem('dailyProgress') || 0);
let lastDaily = parseInt(localStorage.getItem('lastDaily') || 0);
let rewardAd, taskAd, joinAd;

const DAILY_BLOCKS = ["task-35239","task-35240","task-35242","task-35243"];

/* UPDATE DAILY TIMER */
function updateDailyTimer() {
  const timerEl = document.getElementById('dailyTimer');
  const dailyBtn = document.getElementById('dailyBtn');
  
  const now = Date.now();
  const timeRemaining = lastDaily + 86400000 - now;

  if (timeRemaining <= 0 && dailyProgress === 4) {
    // 24 hours passed, reset
    dailyProgress = 0;
    lastDaily = 0;
    localStorage.setItem('dailyProgress', '0');
    localStorage.setItem('lastDaily', '0');
    timerEl.innerText = '';
    dailyBtn.disabled = false;
    dailyBtn.style.opacity = '1';
    document.querySelector("#dailyProgressBar div").style.width = "0%";
  } else if (dailyProgress === 4 && timeRemaining > 0) {
    // Still waiting for 24 hours
    const hours = Math.floor(timeRemaining / 3600000);
    const minutes = Math.floor((timeRemaining % 3600000) / 60000);
    timerEl.innerText = `⏰ Next claim in: ${hours}h ${minutes}m`;
    dailyBtn.disabled = true;
    dailyBtn.style.opacity = '0.5';
  } else {
    timerEl.innerText = '';
    dailyBtn.disabled = false;
    dailyBtn.style.opacity = '1';
  }
}

/* CHECK TIMER EVERY SECOND */
setInterval(updateDailyTimer, 1000);
updateDailyTimer(); // Initial check

/* INITIALIZE ADS */
window.onload = () => {
  updateDailyTimer();
  
  if(typeof Adsgram !== 'undefined'){
    rewardAd = Adsgram.init({ blockId:'35244' });
    taskAd = Adsgram.init({ blockId:'35245' });
    joinAd = Adsgram.init({ blockId:'35246' });
    
    /* PRELOAD JOIN AD */
    joinAd.show().finally(() => {
      document.getElementById("joinPopup").style.display = "flex";
    });
  }
};

/* SPIN WHEEL WITH AD */
spinBtn.addEventListener("click", async () => {
  let energy = document.getElementById("GRAM");

  if (Number(energy.innerText) < 10) {
    alert("Not enough GRAM!");
    return;
  }

  /* Show ad before spin */
  if(!rewardAd) return alert('Ad not ready');
  
  try{
    const res = await rewardAd.show();
    if(res?.done){
      GRAM.innerText = Number(energy.innerText) - 10;
      let taps = document.getElementById("taps");
      taps.innerText = Number(taps.innerText) + 1;

      let spin = 360 * 5 + Math.floor(Math.random() * 360);
      rotation += spin;

      wheel.style.transition = "transform 3.5s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
      wheel.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => {
        let reward = Math.floor(Math.random() * 10) + 1;
        document.getElementById("points").innerText =
          Number(document.getElementById("points").innerText) + reward;

        alert("You won " + reward + " PV!");
      }, 3600);
    }
  }catch(e){
    alert('Ad failed');
  }
});

/* DAILY BONUS WITH AD TASKS - 24 HOUR COOLDOWN */
document.getElementById("dailyBtn").addEventListener("click", async () => {
  let now = Date.now();

  // Check if 24 hours have passed since last daily completion
  if(dailyProgress === 4){
    const timeRemaining = lastDaily + 86400000 - now;
    if(timeRemaining > 0){
      const hours = Math.floor(timeRemaining / 3600000);
      const minutes = Math.floor((timeRemaining % 3600000) / 60000);
      return alert(`⏰ Come back in ${hours}h ${minutes}m for your next daily reward!`);
    } else {
      // Reset for new day
      dailyProgress = 0;
      lastDaily = 0;
      localStorage.setItem('dailyProgress', '0');
      localStorage.setItem('lastDaily', '0');
    }
  }

  if(dailyProgress >= 4){
    return alert('Already completed today');
  }

  if(typeof Adsgram === 'undefined') return alert('Ads not ready');

  let block = DAILY_BLOCKS[dailyProgress];
  let task = document.createElement("adsgram-task");
  task.setAttribute("data-block-id", block);

  document.getElementById('dailyBtn').parentNode.appendChild(task);

  task.addEventListener("reward", () => {
    dailyProgress++;
    task.remove();

    if(dailyProgress === 4){
      let GRAM = document.getElementById("GRAM");
      GRAM.innerText = Number(GRAM.innerText) + 3500;
      lastDaily = now;
      dailyProgress = 4; // Set to 4 to indicate all tasks completed
      localStorage.setItem('lastDaily', now);
      localStorage.setItem('dailyProgress', '4');
      alert("🎉 Daily tasks completed! +3500 GRAM\n⏰ Next claim available in 24 hours");
      document.querySelector("#dailyProgressBar div").style.width = "100%";
      updateDailyTimer();
    } else {
      let GRAM = document.getElementById("GRAM");
      GRAM.innerText = Number(GRAM.innerText) + 14;
      alert("Step " + dailyProgress + " completed! +14 GRAM");
    }

    localStorage.setItem('dailyProgress', dailyProgress);
    let percent = (dailyProgress / 4) * 100;
    document.querySelector("#dailyProgressBar div").style.width = percent + "%";
  });

  if(typeof task.load === "function") task.load();
});

/* REWARD AD */
document.getElementById('rewardBtn').onclick = async () => {
  if(!rewardAd) return alert('Ad not ready');
  try{
    const res = await rewardAd.show();
    if(res?.done){ 
      let GRAM = document.getElementById("GRAM");
      GRAM.innerText = Number(GRAM.innerText) + 10;
      alert('Reward Added +10 GRAM'); 
    }
  }catch(e){}
};

/* TASK AD */
document.getElementById('taskBtn').onclick = async () => {
  if(!taskAd) return alert('Task ad not ready');
  try{
    const res = await taskAd.show();
    if(res?.done){ 
      let GRAM = document.getElementById("GRAM");
      GRAM.innerText = Number(GRAM.innerText) + 10;
      alert('Task Completed +10 GRAM'); 
    }
  }catch(e){}
};

/* JOIN BUTTON */
document.getElementById('joinBtn').onclick = () => {
  let energy = document.getElementById("GRAM");
  energy.innerText = Number(energy.innerText) + 5;
  document.getElementById("joinPopup").style.display = "none";
  window.open("https://t.me/Adatyubot/TapTask?startapp=ref_3EDF03C7","_blank");
};

/* COPY REFERRAL */
document.getElementById('copyBtn').onclick = () => {
  let input = document.getElementById('refInput');
  input.select();
  document.execCommand('copy');
  alert('Copied');
};

/* WITHDRAW */
document.getElementById('withdrawBtn').onclick = () => {
  let amount = parseInt(document.getElementById('amount').value);
  let points = Number(document.getElementById('points').innerText);
  if(!amount || amount < 10000) return alert('Minimum 10,000 PV');
  if(points < amount) return alert('Not enough PV');
  document.getElementById('points').innerText = points - amount;
  alert('Withdraw Sent');
};

</script>

</body>
</html>
